<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏪 Fast Food Store Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #87CEEB; min-height: 100vh; overflow: hidden; }
    
    /* Top Status Bar */
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.7); color: white;
      padding: 10px 20px; display: flex;
      justify-content: space-between; align-items: center;
      z-index: 100;
    }
    .stat { text-align: center; }
    .stat-value { font-size: 20px; font-weight: 700; }
    .money { color: #FFD700; }
    .clean { color: #4CAF50; }
    .time { color: #87CEEB; }
    
    /* Game Area */
    .game-container {
      position: relative; width: 100%; height: 100vh;
      background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
    }
    
    /* Store Building */
    .store {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 900px; height: 70%;
      background: #FFF8DC; border: 8px solid #8B4513; border-bottom: none;
      border-radius: 20px 20px 0 0; overflow: hidden;
    }
    .roof {
      position: absolute; top: -30px; left: -5%; width: 110%; height: 40px;
      background: #E63946; border-radius: 10px 10px 0 0;
    }
    .sign {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: #FFB703; padding: 8px 25px; border-radius: 20px;
      font-weight: 700; font-size: 18px; color: #1D3557;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }
    
    /* Counter */
    .counter {
      position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
      width: 80%; height: 80px; background: #DEB887;
      border-radius: 8px; display: flex;
      align-items: center; justify-content: center;
      border: 4px solid #8B4513;
    }
    .counter-text { font-weight: 700; color: #4A2F0F; font-size: 18px; }
    
    /* Tables */
    .tables {
      position: absolute; bottom: 20px; left: 5%; right: 5%;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
    }
    .table {
      width: 100%; height: 60px; background: #DEB887;
      border-radius: 8px; border: 3px solid #8B4513;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #5D3A1A;
    }
    .table.occupied { background: #CD853F; color: white; }
    
    /* Door */
    .door {
      position: absolute; bottom: 0; right: 30px; width: 70px; height: 120px;
      background: #8B4513; border-radius: 8px 8px 0 0;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: white; font-size: 10px; text-align: center;
    }
    
    /* Trash Items */
    .trash {
      position: absolute; width: 40px; height: 40px;
      background: #8B4513; border-radius: 4px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 20px; transition: transform 0.2s;
    }
    .trash:hover { transform: scale(1.2); }
    
    /* Customer */
    .customer {
      position: absolute; bottom: 20px; width: 50px; height: 70px;
      transition: all 0.5s ease; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
    }
    .customer-body {
      width: 35px; height: 35px; background: #4A90D9; border-radius: 50%;
    }
    .customer-head {
      width: 25px; height: 25px; background: #F5DEB3; border-radius: 50%;
      margin-bottom: -5px;
    }
    .customer-name {
      font-size: 9px; background: rgba(0,0,0,0.7); color: white;
      padding: 2px 5px; border-radius: 4px; margin-top: 3px;
      white-space: nowrap;
    }
    
    /* Order Modal */
    .modal {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: white; padding: 25px; border-radius: 16px;
      box-shadow: 0 5px 30px rgba(0,0,0,0.3); z-index: 200;
      min-width: 300px; display: none;
    }
    .modal.show { display: block; }
    .modal h3 { margin-bottom: 15px; color: #1D3557; text-align: center; }
    .menu-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px; background: #F5F5F5; margin-bottom: 8px; border-radius: 8px;
      cursor: pointer; transition: background 0.2s;
    }
    .menu-item:hover { background: #E8F8F5; }
    .close-btn {
      margin-top: 15px; width: 100%; padding: 10px; background: #E63946;
      color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700;
    }
    .confirm-btn {
      margin-top: 8px; width: 100%; padding: 10px; background: #2A9D8F;
      color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700;
    }
    
    /* Control Buttons */
    .controls {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 100;
    }
    .ctrl-btn {
      padding: 12px 20px; border: none; border-radius: 8px;
      font-weight: 700; cursor: pointer; transition: transform 0.2s;
    }
    .btn-open { background: #4CAF50; color: white; }
    .btn-close { background: #E63946; color: white; }
    .btn-open:hover, .btn-close:hover { transform: scale(1.05); }
    
    /* Message */
    .message {
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: white;
      padding: 12px 25px; border-radius: 8px; z-index: 150;
      display: none;
    }
    .message.show { display: block; animation: fadeOut 3s forwards; }
    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; display: none; }
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="stat">
      <div>Kita</div>
      <div class="stat-value money">₱<span id="money">500.00</span></div>
    </div>
    <div class="stat">
      <div>Kalinis</div>
      <div class="stat-value clean"><span id="cleanliness">100</span>%</div>
    </div>
    <div class="stat">
      <div>Oras</div>
      <div class="stat-value time" id="time">Umaga</div>
    </div>
    <div class="stat">
      <div>Customer</div>
      <div class="stat-value"><span id="cust-count">0</span></div>
    </div>
  </div>

  <!-- Game Area -->
  <div class="game-container">
    <div class="store">
      <div class="roof"></div>
      <div class="sign">🏪 FAST FOOD</div>
      
      <div class="counter" id="counter">
        <span class="counter-text">📋 Counter — Pindutin ang Customer</span>
      </div>
      
      <div class="tables" id="tables">
        <div class="table" data-table="0">Lamesa 1</div>
        <div class="table" data-table="1">Lamesa 2</div>
        <div class="table" data-table="2">Lamesa 3</div>
        <div class="table" data-table="3">Lamesa 4</div>
        <div class="table" data-table="4">Lamesa 5</div>
        <div class="table" data-table="5">Lamesa 6</div>
      </div>
      
      <div class="door" id="door">Pinto<br>→</div>
      
      <!-- Trash Area -->
      <div id="trash-container"></div>
      
      <!-- Customers Area -->
      <div id="customers-container"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn btn-open" id="open-btn" onclick="openStore()">🔔 Buksan ang Tindahan</button>
    <button class="ctrl-btn btn-close" id="close-btn" onclick="closeStore()" style="display:none;">🔕 Isara</button>
  </div>

  <!-- Order Modal -->
  <div class="modal" id="order-modal">
    <h3 id="cust-name">Order ng Customer</h3>
    <div id="menu-list"></div>
    <button class="confirm-btn" id="confirm-order" onclick="confirmOrder()">✅ Kumpirmahin ang Order</button>
    <button class="close-btn" onclick="closeModal()">❌ Kanselahin</button>
  </div>

  <!-- Message -->
  <div class="message" id="message"></div>

  <script>
    // ========== GAME DATA ==========
    const MENU = [
      { name: 'Burger', price: 85 },
      { name: 'Cheese Burger', price: 95 },
      { name: 'Fries — Large', price: 70 },
      { name: 'Fries — Small', price: 35 },
      { name: 'Fried Chicken', price: 65 },
      { name: 'Spaghetti', price: 60 },
      { name: 'Hot Coffee', price: 30 },
      { name: 'Iced Coffee', price: 45 },
      { name: 'Soft Drink', price: 25 },
      { name: 'Mineral Water', price: 20 }
    ];

    let gameState = {
      money: 500,
      cleanliness: 100,
      isOpen: false,
      timeOfDay: 'Umaga',
      customersServed: 0,
      customers: [],
      selectedCustomer: null,
      selectedOrder: null
    };

    const NAMES = ['Juan', 'Maria', 'Pedro', 'Ana', 'Luis', 'Sofia', 'Miguel', 'Carmen', 'Jose', 'Rosa', 'Paolo', 'Bea', 'Mark', 'Jenny'];

    // ========== INITIALIZE ==========
    window.onload = function() {
      generateTrash();
      updateUI();
    };

    // ========== TRASH SYSTEM ==========
    function generateTrash() {
      const container = document.getElementById('trash-container');
      container.innerHTML = '';
      
      if (gameState.cleanliness < 70) {
        const trashCount = Math.floor((100 - gameState.cleanliness) / 15);
        for (let i = 0; i < Math.min(trashCount, 6); i++) {
          const trash = document.createElement('div');
          trash.className = 'trash';
          trash.innerHTML = '🗑️';
          trash.style.left = `${10 + Math.random() * 70}%`;
          trash.style.top = `${35 + Math.random() * 45}%`;
          trash.onclick = () => collectTrash(trash);
          container.appendChild(trash);
        }
      }
    }

    function collectTrash(el) {
      el.style.transform = 'scale(0)';
      setTimeout(() => el.remove(), 200);
      
      gameState.cleanliness = Math.min(100, gameState.cleanliness + 15);
      showMessage('🧹 Nilinis! Kalinisan: ' + gameState.cleanliness + '%');
      updateUI();
      
      if (gameState.cleanliness >= 100) {
        showMessage('✨ Malinis na ang tindahan! Pwede nang magbukas!');
      }
    }

    // ========== STORE CONTROL ==========
    function openStore() {
      if (gameState.cleanliness < 50) {
        showMessage('⚠️ Hindi pa pwede! Linisin muna ang tindahan.');
        return;
      }
      
      gameState.isOpen = true;
      gameState.timeOfDay = 'Tanghali';
      document.getElementById('open-btn').style.display = 'none';
      document.getElementById('close-btn').style.display = 'block';
      
      showMessage('🔔 BUKAS NA! Papasok na ang mga customer...');
      updateUI();
      
      // Start spawning customers
      setInterval(() => {
        if (gameState.isOpen && gameState.customers.length < 6) {
          spawnCustomer();
        }
      }, 4000);
      
      // First customer
      setTimeout(spawnCustomer, 1500);
    }

    function closeStore() {
      gameState.isOpen = false;
      gameState.timeOfDay = 'Gabi';
      document.getElementById('open-btn').style.display = 'block';
      document.getElementById('close-btn').style.display = 'none';
      
      // Remove remaining customers
      gameState.customers.forEach(c => {
        if (c.el) c.el.remove();
      });
      gameState.customers = [];
      
      // Generate some trash overnight
      gameState.cleanliness = Math.max(30, gameState.cleanliness - 25);
      generateTrash();
      
      showMessage('🔕 SARADO NA. Maglinis bago magbukas ulit!');
      updateUI();
    }

    // ========== CUSTOMER SYSTEM ==========
    function spawnCustomer() {
      const name = NAMES[Math.floor(Math.random() * NAMES.length)];
      
      const customer = {
        id: Date.now() + Math.random(),
        name: name,
        state: 'entering', // entering, ordering, waiting, eating, paying, leaving
        order: null,
        table: null,
        el: null
      };
      
      // Create element
      const el = document.createElement('div');
      el.className = 'customer';
      el.innerHTML = `
        <div class="customer-head"></div>
        <div class="customer-body"></div>
        <div class="customer-name">${name}</div>
      `;
      el.style.right = '-60px';
      el.style.bottom = '30px';
      el.onclick = () => selectCustomer(customer);
      
      document.getElementById('customers-container').appendChild(el);
      customer.el = el;
      
      gameState.customers.push(customer);
      
      // Walk to counter
      setTimeout(() => {
        el.style.right = '180px';
        customer.state = 'ordering';
        showMessage(`👤 ${name}: Magandang umaga! Gusto kong umorder.`);
      }, 500);
      
      updateUI();
    }

    function selectCustomer(customer) {
      if (customer.state !== 'ordering') {
        showMessage(`${customer.name}: Salamat po!`);
        return;
      }
      
      gameState.selectedCustomer = customer;
      showOrderModal(customer);
    }

    function showOrderModal(customer) {
      const modal = document.getElementById('order-modal');
      document.getElementById('cust-name').textContent = `Order ni ${customer.name}`;
      
      const list = document.getElementById('menu-list');
      list.innerHTML = '';
      
      MENU.forEach(item => {
        const div = document.createElement('div');
        div.className = 'menu-item';
        div.innerHTML = `
          <span>${item.name}</span>
          <span><strong>₱${item.price.toFixed(2)}</strong></span>
        `;
        div.onclick = () => {
          gameState.selectedOrder = item;
          document.querySelectorAll('.menu-item').forEach(e => e.style.border = 'none');
          div.style.border = '2px solid #2A9D8F';
        };
        list.appendChild(div);
      });
      
      modal.classList.add('show');
    }

    function closeModal() {
      document.getElementById('order-modal').classList.remove('show');
      gameState.selectedCustomer = null;
      gameState.selectedOrder = null;
    }

    function confirmOrder() {
      if (!gameState.selectedOrder) {
        showMessage('Pumili muna ng pagkain!');
        return;
      }
      
      const customer = gameState.selectedCustomer;
      const order = gameState.selectedOrder;
      
      customer.order = order;
      customer.state = 'waiting';
      
      closeModal();
      
      showMessage(`✅ ${customer.name}: ${order.name} — ₱${order.price.toFixed(2)} Salamat!`);
      
      // Find empty table
      const tables = document.querySelectorAll('.table:not(.occupied)');
      if (tables.length > 0) {
        const table = tables[Math.floor(Math.random() * tables.length)];
        table.classList.add('occupied');
        customer.table = table;
        
        // Move to table
        customer.el.style.right = `${15 + Math.random() * 40}%`;
        customer.state = 'eating';
        
        // Eat then pay
        setTimeout(() => finishEating(customer), 4000 + Math.random() * 3000);
      } else {
        // No table — pay and leave
        setTimeout(() => payAndLeave(customer), 2000);
      }
    }

    function finishEating(customer) {
      showMessage(`🍽️ ${customer.name}: Busog na! Magbabayad na.`);
      payAndLeave(customer);
    }

    function payAndLeave(customer) {
      customer.state = 'paying';
      
      // Add money
      gameState.money += customer.order.price;
      gameState.customersServed++;
      
      showMessage(`💸 Nakatanggap ng ₱${customer.order.price.toFixed(2)} mula kay ${customer.name}!`);
      
      // Free table
      if (customer.table) {
        customer.table.classList.remove('occupied');
      }
      
      // Walk out
      customer.el.style.right = '-60px';
      customer.state = 'leaving';
      
      // Remove
      setTimeout(() => {
        if (customer.el) customer.el.remove();
        gameState.customers = gameState.customers.filter(c => c.id !== customer.id);
        updateUI();
      }, 1000);
      
      updateUI();
    }

    // ========== UTILITIES ==========
    function showMessage(text) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.classList.add('show');
      setTimeout(() => msg.classList.remove('show'), 3000);
    }

    function updateUI() {
      document.getElementById('money').textContent = gameState.money.toFixed(2);
      document.getElementById('cleanliness').textContent = gameState.cleanliness;
      document.getElementById('time').textContent = gameState.timeOfDay;
      document.getElementById('cust-count').textContent = gameState.customersServed;
      
      // Trash appears when dirty
      if (gameState.cleanliness < 70) {
        generateTrash();
      }
    }
  </script>
</body>
</html>
